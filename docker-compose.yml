volumes:
  node_modules:
  hedgedoc_public:
    driver: local

networks:
    sandboxer:
        driver: bridge

services:
  node:
    image: node:24.21.0-alpine3.24
    profiles: [frontend]
    init: true
    working_dir: /app
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "5173", --strictPort]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - type: bind
        source: ./www/${APP_PATH:-laravel}
        target: /app
        bind:
          create_host_path: false
      - node_modules:/app/node_modules
    networks:
      - sandboxer
  setup: # A one-time-run setup service for when starting containers. Also, this is the service name which should only be unique to this docker-compose project
    command: /bin/sh /setup.sh
    build:
      context: ./
      dockerfile: setup.dockerfile
    image: sandboxer-setup
    volumes:
      - ./www:/srv/sandboxer
    restart: no
  db:
    image: mariadb:11.4.13
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
        - "127.0.0.1:3306:3306"
    volumes:
     - ./dbdata:/var/lib/mysql
     - ./iedata:/srv/iedata
    networks:
      sandboxer:
  # Creates the dedicated database/account, then exits. Safe to rerun.
  wordpress-db-setup:
    image: sandboxer-php
    build:
      context: ./
      dockerfile: php8.5-fpm.dockerfile
    entrypoint: [php, /application-database.php]
    command: [WORDPRESS]
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?Set WORDPRESS_DB_NAME in .env}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?Set WORDPRESS_DB_USER in .env}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
    volumes:
      - ./config/install-scripts/application-database.php:/application-database.php:ro
    networks:
      - sandboxer
    depends_on:
      db:
        condition: service_healthy
  hedgedoc-db-setup:
    image: sandboxer-php
    build:
      context: ./
      dockerfile: php8.5-fpm.dockerfile
    entrypoint: [php, /application-database.php]
    command: [HEDGEDOC]
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      HEDGEDOC_DB_NAME: ${HEDGEDOC_DB_NAME:?Set HEDGEDOC_DB_NAME in .env}
      HEDGEDOC_DB_USER: ${HEDGEDOC_DB_USER:?Set HEDGEDOC_DB_USER in .env}
      HEDGEDOC_DB_PASSWORD: ${HEDGEDOC_DB_PASSWORD:?Set HEDGEDOC_DB_PASSWORD in .env}
    volumes:
      - ./config/install-scripts/application-database.php:/application-database.php:ro
    networks:
      - sandboxer
    depends_on:
      db:
        condition: service_healthy
  php:
    build:
      context: ./
      dockerfile: ./php8.5-fpm.dockerfile
    image: sandboxer-php # Name of the image to build
    expose:
      - "9000" # Expose a port on the virtual network (sandboxer), but do not expose it on the HOST
    networks:
      - sandboxer
    volumes:
      - ./www:/srv/sandboxer # Mount a "www" directory on the host that is shared with the web server. E.g. Apache or Nginx
      - ./log/php:/var/log/php85 # Mount the log file directory to a place on host so we can access the log files
      - hedgedoc_public:/hedgedoc/public:ro
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?Set WORDPRESS_DB_NAME in .env}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?Set WORDPRESS_DB_USER in .env}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
      HEDGEDOC_DB_NAME: ${HEDGEDOC_DB_NAME:?Set HEDGEDOC_DB_NAME in .env}
      HEDGEDOC_DB_USER: ${HEDGEDOC_DB_USER:?Set HEDGEDOC_DB_USER in .env}
      HEDGEDOC_DB_PASSWORD: ${HEDGEDOC_DB_PASSWORD:?Set HEDGEDOC_DB_PASSWORD in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/php-fpm-healthcheck"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 6
  apache2:
    ports:
      - "127.0.0.1:80:80" # Publish only on the host's IPv4 loopback interface.
    networks:
      - sandboxer
    build:
      context: ./
      dockerfile: apache2.dockerfile
    image: sandboxer-apache2
    volumes:
      - ./www:/srv/sandboxer
      - ./log/apache2:/var/log/apache2
      - hedgedoc_public:/srv/hedgedoc/public:ro
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      wordpress-db-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      php:
        condition: service_healthy
      hedgedoc:
        condition: service_healthy
  hedgedoc:
    image: sandboxer-hedgedoc
    build:
      context: .
      dockerfile: hedgedoc.dockerfile
    environment:
      CMD_DB_DIALECT: mariadb
      CMD_DB_HOST: db
      CMD_DB_PORT: "3306"
      CMD_DB_DATABASE: ${HEDGEDOC_DB_NAME:?Set HEDGEDOC_DB_NAME in .env}
      CMD_DB_USERNAME: ${HEDGEDOC_DB_USER:?Set HEDGEDOC_DB_USER in .env}
      CMD_DB_PASSWORD: ${HEDGEDOC_DB_PASSWORD:?Set HEDGEDOC_DB_PASSWORD in .env}
      CMD_DOMAIN: hedgedoc.localhost
      CMD_SESSION_SECRET: ${HEDGEDOC_SESSION_SECRET:-sandboxer-local-development-session-secret}
      CMD_HOST: 0.0.0.0
      CMD_PROTOCOL_USESSL: "false"
      CMD_URL_ADDPORT: "false"
      CMD_IMAGE_UPLOAD_TYPE: filesystem
      CMD_ENABLE_UPLOADS: all
      CMD_SOURCE_URL: https://github.com/Turbulentarius/hedgedoc
      CMD_PORT: "3000"
    volumes:
      - hedgedoc_public:/data
    networks:
      - sandboxer
    restart: unless-stopped
    depends_on:
      hedgedoc-db-setup:
        condition: service_completed_successfully
      setup:
        condition: service_completed_successfully
  hedgedoc-setup:
    image: sandboxer-hedgedoc
    # Reuse the fork image built by hedgedoc, never pull a same-named registry image.
    pull_policy: never
    user: hedgedoc
    entrypoint: [node]
    command: [/hedgedoc/create-sandboxer-user.js]
    healthcheck:
      disable: true
    environment:
      CMD_DB_DIALECT: mariadb
      CMD_DB_HOST: db
      CMD_DB_PORT: "3306"
      CMD_DB_DATABASE: ${HEDGEDOC_DB_NAME:?Set HEDGEDOC_DB_NAME in .env}
      CMD_DB_USERNAME: ${HEDGEDOC_DB_USER:?Set HEDGEDOC_DB_USER in .env}
      CMD_DB_PASSWORD: ${HEDGEDOC_DB_PASSWORD:?Set HEDGEDOC_DB_PASSWORD in .env}
      CMD_DOMAIN: hedgedoc.localhost
      SANDBOXER_HEDGEDOC_PASSWORD: ${HEDGEDOC_PASSWORD:?Set HEDGEDOC_PASSWORD in .env}
    volumes:
      - hedgedoc_public:/data
      - ./config/install-scripts/hedgedoc-user.js:/hedgedoc/create-sandboxer-user.js:ro
    networks:
      - sandboxer
    restart: "no"
    depends_on:
      hedgedoc:
        condition: service_healthy
