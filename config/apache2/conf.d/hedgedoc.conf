<VirtualHost *:80>
    ServerName hedgedoc.localhost

    Alias /uploads/ /srv/hedgedoc/public/uploads/

    <Directory "/srv/hedgedoc/public/uploads">
        Options -Indexes
        Require all granted
    </Directory>

    ProxyPreserveHost On

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://hedgedoc:3000/$1 [P,L]

    # Keep the fork's Profundarium header links on this same hostname.
    Alias /profundarium/assets/ /srv/sandboxer/profundarium/public/profundarium/assets/
    <Directory "/srv/sandboxer/profundarium/public">
        Require all granted
        AllowOverride None
        Options +FollowSymLinks -Indexes -MultiViews
    </Directory>
    ProxyPass /profundarium/assets/ !
    ProxyPassMatch "^/profundarium(?:/.*)?$" "fcgi://php:9000/srv/sandboxer/profundarium/public/index.php"

    ProxyPass /uploads/ !
    ProxyPass / http://hedgedoc:3000/
    ProxyPassReverse / http://hedgedoc:3000/
</VirtualHost>